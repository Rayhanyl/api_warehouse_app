name: Backend CD

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/wms-backend

jobs:
  build-and-push:
    name: Build Docker Image & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ekstrak Metadata & Tagging Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Container ke Production Server
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Eksekusi Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          port: ${{ secrets.PROD_SERVER_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "=== Memulai Deployment Backend JejakStok (api-jkstok.my.id) ==="
            cd /opt/wms

            echo "1. Login ke GHCR Container Registry..."
            echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "2. Menarik Image Backend Terbaru..."
            docker compose -f docker-compose.prod.yml pull backend backend-migration

            echo "3. Menjalankan Migrasi Database..."
            docker compose -f docker-compose.prod.yml run --rm backend-migration

            echo "4. Menjalankan Container Backend Baru (Rolling Update)..."
            docker compose -f docker-compose.prod.yml up -d backend

            echo "5. Verifikasi Healthcheck..."
            docker compose -f docker-compose.prod.yml ps backend
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error http://127.0.0.1:8000/health; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "Healthcheck gagal setelah menunggu container siap."
                exit 1
              fi
              echo "Healthcheck belum siap (percobaan $attempt/30), menunggu 2 detik..."
              sleep 2
            done

            echo "6. Pembersihan Docker Image Gantung..."
            docker image prune -af --filter "until=72h"

            echo "=== Deployment Backend Selesai dengan Sukses ==="
