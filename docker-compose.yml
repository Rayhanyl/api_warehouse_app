services:
  postgres:
    image: postgres:16-alpine
    container_name: wms_postgres
    restart: unless-stopped
    # Seluruh konfigurasi (POSTGRES_USER/PASSWORD/DB, WMS_APP_PASSWORD) berasal dari
    # `.env.docker`. Jangan menambah blok `environment:` yang menginterpolasi variabel
    # yang sama: nilai `environment` menimpa `env_file` dan interpolasi membaca `.env`
    # (konfigurasi PC), bukan `.env.docker`.
    env_file:
      - .env.docker
    ports:
      # Hanya loopback: database dev tidak boleh terbuka ke jaringan LAN.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-wms_owner} -d $${POSTGRES_DB:-wms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wms_api
    restart: unless-stopped
    # DATABASE_URL, MIGRATION_DATABASE_URL, JWT_*, FRONTEND_ORIGINS, COOKIE_*, APP_ENV,
    # dan seluruh variabel aplikasi lain berasal dari `.env.docker` (lihat .env.docker.example).
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./app:/app/app
      - ./db:/app/db
      - ./scripts:/app/scripts
    command: >
      sh -c "python -m db.migrate && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
